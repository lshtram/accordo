<svg id="accordo-mermaid-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 770 450" style="max-width: 770px;" role="graphics-document document" aria-roledescription="pie"><style>#accordo-mermaid-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#e5e7eb;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#accordo-mermaid-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#accordo-mermaid-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#accordo-mermaid-svg .error-icon{fill:#ef4444;}#accordo-mermaid-svg .error-text{fill:#10bbbb;stroke:#10bbbb;}#accordo-mermaid-svg .edge-thickness-normal{stroke-width:1px;}#accordo-mermaid-svg .edge-thickness-thick{stroke-width:3.5px;}#accordo-mermaid-svg .edge-pattern-solid{stroke-dasharray:0;}#accordo-mermaid-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#accordo-mermaid-svg .edge-pattern-dashed{stroke-dasharray:3;}#accordo-mermaid-svg .edge-pattern-dotted{stroke-dasharray:2;}#accordo-mermaid-svg .marker{fill:#f59e0b;stroke:#f59e0b;}#accordo-mermaid-svg .marker.cross{stroke:#f59e0b;}#accordo-mermaid-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#accordo-mermaid-svg p{margin:0;}#accordo-mermaid-svg .pieCircle{stroke:black;stroke-width:2px;opacity:0.7;}#accordo-mermaid-svg .pieOuterCircle{stroke:black;stroke-width:2px;fill:none;}#accordo-mermaid-svg .pieTitleText{text-anchor:middle;font-size:25px;fill:#e5e7eb;font-family:"trebuchet ms",verdana,arial,sans-serif;}#accordo-mermaid-svg .slice{font-family:"trebuchet ms",verdana,arial,sans-serif;fill:#e5e7eb;font-size:17px;}#accordo-mermaid-svg .legend text{fill:#e5e7eb;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:17px;}#accordo-mermaid-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g transform="translate(225,225)"><circle cx="0" cy="0" r="186" class="pieOuterCircle"></circle><path d="M0,-185A185,185,0,1,1,-142.545,117.923L0,0Z" fill="#3b82f6" class="pieCircle"></path><path d="M-142.545,117.923A185,185,0,0,1,-108.74,-149.668L0,0Z" fill="#10b981" class="pieCircle"></path><path d="M-108.74,-149.668A185,185,0,0,1,0,-185L0,0Z" fill="#f59e0b" class="pieCircle"></path><text transform="translate(125.5447535296602,59.07687670465385)" class="slice" style="text-anchor: middle;">64%</text><text transform="translate(-137.6559148073838,-17.38998615704722)" class="slice" style="text-anchor: middle;">26%</text><text transform="translate(-42.87610796952397,-131.95909163595255)" class="slice" style="text-anchor: middle;">10%</text><text x="0" y="-200" class="pieTitleText">Outcome after systemized authoring</text><g class="legend" transform="translate(216,-33)"><rect width="18" height="18" style="fill: rgb(59, 130, 246); stroke: rgb(59, 130, 246);"></rect><text x="22" y="14">Slides that fit first pass [64]</text></g><g class="legend" transform="translate(216,-11)"><rect width="18" height="18" style="fill: rgb(16, 185, 129); stroke: rgb(16, 185, 129);"></rect><text x="22" y="14">Slides needing one redesign [26]</text></g><g class="legend" transform="translate(216,11)"><rect width="18" height="18" style="fill: rgb(245, 158, 11); stroke: rgb(245, 158, 11);"></rect><text x="22" y="14">Slides needing deeper rewrite [10]</text></g></g></svg>
